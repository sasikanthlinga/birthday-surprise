<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Cards Birthday Game</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b
    );
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    overflow-x:hidden;
    text-align:center;
}

h1{
    margin:20px 10px;
    color:#FFD700;
}

#game{

    width:min(95vw,600px);

    margin:20px auto;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:10px;
}

.card{

    position:relative;

    aspect-ratio:1;

    cursor:pointer;

    transform-style:preserve-3d;

    transition:transform .6s;

}

.card.flipped{

    transform:rotateY(180deg);
}

.front,
.back{

    position:absolute;

    inset:0;

    border-radius:12px;

    backface-visibility:hidden;

    overflow:hidden;
}

.front{

    background:
    linear-gradient(
    135deg,
    #D4AF37,
    #FFD700,
    #FFF8DC
    );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:32px;

    color:white;

    box-shadow:
    0 0 15px rgba(255,215,0,.6);
}

.back{

    transform:rotateY(180deg);

    background-size:cover;
    background-position:center;
}

.matched{

    pointer-events:none;

    animation:glow 1s infinite alternate;
}

@keyframes glow{

    from{

        box-shadow:
        0 0 10px #FFD700;
    }

    to{

        box-shadow:
        0 0 30px #FFD700,
        0 0 60px #FFD700;
    }
}

#message{

    display:none;

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.92);

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:9999;

    padding:25px;
}

#message h2{

    color:#FFD700;

    font-size:42px;

    margin-bottom:20px;
}

#message p{

    max-width:650px;

    line-height:1.7;

    font-size:20px;
}

#restart{

    margin-top:25px;

    padding:12px 24px;

    border:none;

    border-radius:10px;

    background:#FFD700;

    font-weight:bold;

    cursor:pointer;
}

.sparkle{

    position:fixed;

    color:#FFD700;

    pointer-events:none;

    animation:sparkle 1.2s linear forwards;
}

@keyframes sparkle{

    to{

        opacity:0;

        transform:
        translateY(-60px)
        scale(3);
    }
}

@media(max-width:600px){

    #game{

        gap:8px;
    }

    #message h2{

        font-size:32px;
    }

    #message p{

        font-size:16px;
    }
}

</style>
</head>
<body>

<h1>🃏 Match All Memories 🃏</h1>

<div id="game"></div>

<div id="message">

    <h2>❤️ Happy Birthday ❤️</h2>

    <p>

        You unlocked all the beautiful memories!

        Wishing you happiness, success,
        love, laughter and endless joy.

        May all your dreams come true and
        every day bring wonderful moments.

        🎂✨ Have an Amazing Birthday! ✨🎂

    </p>

    <button id="restart">
        Play Again
    </button>

</div>

<script>

const photos = [

"photo1.jpeg",
"photo2.jpeg",
"photo3.jpeg",
"photo4.jpeg",
"photo5.jpeg",
"photo6.jpeg",
"photo7.jpeg",
"photo8.jpeg"

];

const cardsData = [

...photos,
...photos

];

cardsData.sort(
()=>Math.random()-0.5
);

const game =
document.getElementById("game");

let firstCard = null;
let secondCard = null;

let lockBoard = false;
let matches = 0;

cardsData.forEach(photo=>{

    const card =
    document.createElement("div");

    card.className = "card";

    card.dataset.image = photo;

    card.innerHTML =

    `
    <div class="front">✨</div>
    <div class="back"
     style="
     background-image:
     url('${photo}');
     ">
    </div>
    `;

    card.addEventListener(
        "click",
        flipCard
    );

    game.appendChild(card);

});

function flipCard(){

    if(lockBoard) return;

    if(this===firstCard) return;

    this.classList.add("flipped");

    if(!firstCard){

        firstCard=this;
        return;
    }

    secondCard=this;

    checkMatch();
}

function checkMatch(){

    const match =

    firstCard.dataset.image ===
    secondCard.dataset.image;

    if(match){

        disableCards();

    }else{

        unflipCards();
    }
}

function disableCards(){

    firstCard.classList.add("matched");

    secondCard.classList.add("matched");

    matches++;

    createStars();

    resetTurn();

    if(matches===8){

        setTimeout(()=>{

            document
            .getElementById("message")
            .style.display="flex";

        },800);
    }
}

function unflipCards(){

    lockBoard=true;

    setTimeout(()=>{

        firstCard.classList.remove(
        "flipped");

        secondCard.classList.remove(
        "flipped");

        resetTurn();

    },900);
}

function resetTurn(){

    firstCard=null;

    secondCard=null;

    lockBoard=false;
}

function createStars(){

    for(let i=0;i<15;i++){

        const star =
        document.createElement("div");

        star.className="sparkle";

        star.innerHTML="✦";

        star.style.left=
        Math.random()*100+"vw";

        star.style.top=
        Math.random()*100+"vh";

        document.body
        .appendChild(star);

        setTimeout(()=>{

            star.remove();

        },1200);
    }
}

document
.getElementById("restart")
.addEventListener(
"click",
()=>location.reload()
);

</script>

</body>
</html>
