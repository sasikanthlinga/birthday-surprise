<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Firework Photo Reveal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:hidden;

    background:
    radial-gradient(
        circle at center,
        #111,
        #000
    );

    font-family:Arial,sans-serif;
}

#sky{

    width:100vw;
    height:100vh;

    position:relative;

    overflow:hidden;
}

.star{

    position:absolute;

    background:white;

    border-radius:50%;
}

#photo{

    position:absolute;

    inset:0;

    opacity:0;

    transition:1s;

    background-size:cover;
    background-position:center;
}

#tapText{

    position:absolute;

    top:30px;
    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:24px;

    z-index:1000;

    text-shadow:
    0 0 10px white;
}

.rocket{

    position:absolute;

    width:4px;
    height:40px;

    background:white;

    border-radius:10px;
}

.particle{

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;
}

#message{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:
    rgba(0,0,0,.85);

    color:white;

    text-align:center;

    padding:30px;

    z-index:3000;
}

#message h1{

    font-size:60px;

    color:#ff4da6;

    text-shadow:
    0 0 20px white,
    0 0 40px #ff4da6;
}

#message p{

    margin-top:20px;

    max-width:700px;

    font-size:24px;

    line-height:1.6;
}

@media(max-width:768px){

    #message h1{
        font-size:40px;
    }

    #message p{
        font-size:18px;
    }

    #tapText{
        font-size:20px;
    }
}

</style>
</head>
<body>

<div id="sky">

<div id="photo"></div>

<div id="tapText">
🎆 Tap Anywhere To Launch A Firework 🎆
</div>

</div>

<div id="message">

<h1>❤️ Happy Birthday ❤️</h1>

<p>

May your special day be filled with
happiness, laughter and unforgettable memories.

<br><br>

Wishing you success,
good health,
and endless joy.

<br><br>

🎂 Have An Amazing Birthday! 🎂

</p>

</div>

<script>

const photos=[

"photo1.jpeg",
"photo2.jpeg",
"photo3.jpeg",
"photo4.jpeg",
"photo5.jpeg"

];

let currentPhoto=0;

const sky=
document.getElementById("sky");

const photoDiv=
document.getElementById("photo");


// Stars

for(let i=0;i<150;i++){

    const star=
    document.createElement("div");

    star.className="star";

    const size=
    Math.random()*3;

    star.style.width=
    size+"px";

    star.style.height=
    size+"px";

    star.style.left=
    Math.random()*100+"vw";

    star.style.top=
    Math.random()*100+"vh";

    sky.appendChild(star);
}

// Firework

function launchFirework(x){

    const rocket=
    document.createElement("div");

    rocket.className=
    "rocket";

    rocket.style.left=
    x+"px";

    rocket.style.bottom=
    "0px";

    sky.appendChild(rocket);

    rocket.animate(
    [
        {
            transform:
            "translateY(0)"
        },
        {
            transform:
            "translateY(-70vh)"
        }
    ],
    {
        duration:1200,
        easing:"ease-out"
    });

    setTimeout(()=>{

        rocket.remove();

        explode(
            x,
            window.innerHeight*0.3
        );

    },1200);
}

function explode(x,y){

    const colors=[

    "#ff4da6",
    "#00ffff",
    "#ffff00",
    "#00ff66",
    "#ff6600"

    ];

    for(let i=0;i<80;i++){

        const p=
        document.createElement("div");

        p.className=
        "particle";

        p.style.background=
        colors[
        Math.floor(
        Math.random()*colors.length
        )
        ];

        p.style.left=
        x+"px";

        p.style.top=
        y+"px";

        sky.appendChild(p);

        const angle=
        Math.random()*360;

        const dist=
        80+Math.random()*150;

        const dx=
        Math.cos(
        angle*Math.PI/180
        )*dist;

        const dy=
        Math.sin(
        angle*Math.PI/180
        )*dist;

        p.animate(
        [
        {
            transform:
            "translate(0,0)",
            opacity:1
        },
        {
            transform:
            `translate(${dx}px,${dy}px)`,
            opacity:0
        }
        ],
        {
            duration:1500,
            easing:"ease-out"
        });

        setTimeout(()=>{
            p.remove();
        },1500);
    }

    revealPhoto();
}

function revealPhoto(){

    if(currentPhoto < photos.length){

        photoDiv.style.backgroundImage=
        `url('${photos[currentPhoto]}')`;

        photoDiv.style.opacity="1";

        setTimeout(()=>{

            photoDiv.style.opacity="0";

        },2500);

        currentPhoto++;
    }
    else{

        grandFinale();
    }
}

function grandFinale(){

    for(let i=0;i<8;i++){

        setTimeout(()=>{

            launchFirework(
                Math.random()*window.innerWidth
            );

        },i*300);
    }

    setTimeout(()=>{

        confetti();

        document
        .getElementById("message")
        .style.display=
        "flex";

    },3500);
}

function confetti(){

    const colors=[

    "#ff4da6",
    "#00ffff",
    "#ffff00",
    "#00ff66",
    "#ff6600"

    ];

    for(let i=0;i<250;i++){

        const c=
        document.createElement("div");

        c.className=
        "particle";

        c.style.background=
        colors[
        Math.floor(
        Math.random()*colors.length
        )
        ];

        c.style.left=
        Math.random()*100+"vw";

        c.style.top=
        "-20px";

        document.body
        .appendChild(c);

        c.animate(
        [
        {
            transform:
            "translateY(0) rotate(0deg)"
        },
        {
            transform:
            "translateY(120vh) rotate(720deg)"
        }
        ],
        {
            duration:
            4000+Math.random()*3000,
            easing:"linear"
        });
    }
}

sky.addEventListener(
"click",
e=>{

    launchFirework(
        e.clientX
    );

});

sky.addEventListener(
"touchstart",
e=>{

    const touch=
    e.touches[0];

    launchFirework(
        touch.clientX
    );

},
{passive:true}
);

</script>

</body>
</html>
