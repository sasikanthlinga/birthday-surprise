<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scratch Reveal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

.card{
    position:relative;
    width:350px;
    height:500px;
    overflow:hidden;
    border-radius:20px;
    box-shadow:0 0 30px rgba(255,255,255,.3);
}
.card img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}


canvas{
    position:absolute;
    inset:0;
    touch-action:none;
}

.message{
    position:absolute;
    bottom:15px;
    left:0;
    width:100%;
    text-align:center;
    color:white;
    font-size:24px;
    text-shadow:0 0 10px black;
}
</style>
</head>
<body>

<div class="card">

    <img src="photo1.jpeg" alt="Photo">

    <canvas id="scratch"></canvas>

    <div class="message">
        Scratch Here ✨
    </div>

</div>

<script>

const canvas = document.getElementById('scratch');
const ctx = canvas.getContext('2d');

canvas.width = 350;
canvas.height = 500;

ctx.fillStyle = '#C0C0C0';
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = '#888';
ctx.font = 'bold 40px Arial';
ctx.textAlign = 'center';
ctx.fillText('SCRATCH',canvas.width/2,250);

let drawing = false;

function scratch(x,y){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x,y,30,0,Math.PI*2);
    ctx.fill();
}

canvas.addEventListener('mousedown',()=>{
    drawing=true;
});

canvas.addEventListener('mouseup',()=>{
    drawing=false;
});

canvas.addEventListener('mousemove',(e)=>{
    if(!drawing) return;

    const rect=canvas.getBoundingClientRect();

    scratch(
        e.clientX-rect.left,
        e.clientY-rect.top
    );
});

canvas.addEventListener('touchstart',()=>{
    drawing=true;
});

canvas.addEventListener('touchend',()=>{
    drawing=false;
});

canvas.addEventListener('touchmove',(e)=>{

    e.preventDefault();

    if(!drawing) return;

    const rect=canvas.getBoundingClientRect();

    scratch(
        e.touches[0].clientX-rect.left,
        e.touches[0].clientY-rect.top
    );

},{passive:false});

</script>

</body>
</html>
