<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Puzzle</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Arial,sans-serif;
    text-align:center;
    min-height:100vh;
    overflow-x:hidden;
}

h1{
    color:white;
    margin:15px 0;
}

.controls{
    margin-bottom:15px;
}

button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

#shuffleBtn{
    background:#00bfff;
    color:white;
}

#resetBtn{
    background:#ff4da6;
    color:white;
}

#board{
    width:450px;
    height:450px;
    margin:20px auto;
    position:relative;
    border:4px solid white;
}

.slot{
    position:absolute;
    width:150px;
    height:150px;
    border:1px dashed rgba(255,255,255,.3);
}

.piece{
    position:absolute;
    width:150px;
    height:150px;

    background-image:url('photo1.jpeg');
    background-size:450px 450px;

    border:1px solid white;
    box-shadow:0 0 10px rgba(255,255,255,.4);

    cursor:grab;
    touch-action:none;
    z-index:100;
}

#message{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);

    width:90%;
    max-width:700px;

    background:rgba(0,0,0,.92);
    border:3px solid #ff4da6;
    border-radius:25px;

    padding:30px;
    text-align:center;
    color:white;

    opacity:0;
    visibility:hidden;

    z-index:9999;
}
#message{
    overflow:visible;
}

#message::before{
    pointer-events:none;
}


#message.show{
    opacity:1;
    visibility:visible;
    animation:popExplosion .8s ease forwards;
box-shadow:
    0 0 25px #ff4da6,
    0 0 50px #ff00ff,
    0 0 80px #FFD700;
}

@keyframes popExplosion{
    0%{
        transform:translate(-50%,-50%) scale(0);
    }

    60%{
        transform:translate(-50%,-50%) scale(1.15);
    }

    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}

#message{
    overflow:visible;
}

#message.show::after{
    content:"🎉 ✨ 🎊 💖 ⭐ 🎆";
    position:absolute;

    top:50%;
    left:50%;

    font-size:50px;
    white-space:nowrap;

    transform:translate(-50%,-50%) scale(0);

    animation:explode 1s ease-out;

    pointer-events:none;
}

@keyframes explode{

    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(0);
    }

    70%{
        opacity:1;
        transform:translate(-50%,-50%) scale(2.5);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(4);
    }

}

@keyframes explode{
    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(0);
    }

    70%{
        opacity:1;
        transform:translate(-50%,-50%) scale(2.5);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(4);
    }
}



#message h2{
    font-size:60px;
    color:#ff4da6;
}

#message p{
    font-size:24px;
    margin-top:15px;
}
#gamesSection{

    margin-top:80px;

    padding:60px 20px;

    background:#0f172a;
}

#gamesSection h2{

    color:#FFD700;

    margin-bottom:30px;

    font-size:32px;
}

.games-grid{

    display:grid;

    gap:15px;

    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    max-width:900px;

    margin:auto;
}

.games-grid button{

    padding:18px;

    border:none;

    border-radius:15px;

    background:
    linear-gradient(
        135deg,
        #ff4da6,
        #7c3aed
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

.games-grid button:hover{

    transform:
    translateY(-5px);

    box-shadow:
    0 0 20px #ff4da6;
}
.games-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:15px;

    max-width:800px;

    margin:30px auto;
}

.games-grid button{

    padding:16px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    color:white;

    font-size:16px;

    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        #ff4da6,
        #7c3aed
    );

    transition:.3s;
}

.games-grid button:hover{

    transform:translateY(-5px);

    box-shadow:
    0 0 20px #ff4da6;
}
</style>
</head>
<body>

<h1>🧩 Complete The Puzzle</h1>

<div class="controls">
    <button id="shuffleBtn">🔀 Shuffle</button>
    <button id="resetBtn">🔄 Reset</button>
</div>

<div id="board"></div>

<div id="message">
    <h2>❤️ Happy Birthday ❤️</h2>

    <p>
        You completed the puzzle!
        Wishing you happiness, success,
        laughter and beautiful memories.
    </p>
</div>

<section id="gamesSection" style="display:none;">
    <h2>🎮 Birthday Games</h2>

    <div class="games-grid">

        <button onclick="location.href='goldDustReveal.html'">
            ✨ Gold Dust
        </button>

        <button onclick="location.href='rocketJourney.html'">
            🚀 Rocket Journey
        </button>

        <button onclick="location.href='memoryCards.html'">
            🃏 Memory Cards
        </button>

        <button onclick="location.href='scratch_card.html'">
            🎫 Scratch Card
        </button>

        <button onclick="location.href='fireworks.html'">
            🎆 Fireworks
        </button>

        <button onclick="location.href='shufflePuzzle2.html'">
            ❤️ One more Puzzle
        </button>

    </div>
</section>

<script>

const board = document.getElementById("board");

const correct = {};
const pieces = [];

let solved = 0;
const size = 150;

/* Create Slots and Pieces */

for(let row=0; row<3; row++){

    for(let col=0; col<3; col++){

        const index = row*3 + col;

        // SLOT

        const slot = document.createElement("div");

        slot.className = "slot";
        slot.id = "s" + index;

        slot.style.left = (col * size) + "px";
        slot.style.top = (row * size) + "px";

        board.appendChild(slot);

        // PIECE

        const piece = document.createElement("div");

        piece.className = "piece";
        piece.id = "p" + index;

        piece.style.backgroundPosition =
            `${-col*size}px ${-row*size}px`;

        document.body.appendChild(piece);

        pieces.push(piece);

        correct[piece.id] = slot.id;

        makeDraggable(piece);
    }
}

/* Reset */

function resetPieces(){

    solved = 0;

document.getElementById("message").classList.remove("show");
document.getElementById("gamesSection").style.display = "none";

    pieces.forEach((piece,index)=>{

        piece.dataset.locked = "";

        piece.style.pointerEvents = "auto";

        piece.style.left =
            (20 + (index % 5) * 160) + "px";

        piece.style.top =
            (550 + Math.floor(index / 5) * 170) + "px";

    });
}

/* Shuffle */

function shufflePieces(){

    solved = 0;

    document.getElementById("message")
        .classList.remove("show");

document.getElementById("gamesSection")
        .style.display = "none";

    pieces.forEach(piece=>{

        piece.dataset.locked = "";

        piece.style.pointerEvents = "auto";

        piece.style.left =
            Math.random() * (window.innerWidth - 180) + "px";

        piece.style.top =
            (500 + Math.random() * 200) + "px";

    });

}

/* Drag Logic */

function makeDraggable(piece){

    let offsetX = 0;
    let offsetY = 0;

    function start(e){

        if(piece.dataset.locked === "yes") return;

        const touch = e.touches ? e.touches[0] : e;

        offsetX = touch.clientX - piece.offsetLeft;
        offsetY = touch.clientY - piece.offsetTop;

        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", end);

        document.addEventListener("touchmove", move,{passive:false});
        document.addEventListener("touchend", end);
    }

    function move(e){

        if(e.cancelable){
            e.preventDefault();
        }

        const touch = e.touches ? e.touches[0] : e;

        piece.style.left =
            (touch.clientX - offsetX) + "px";

        piece.style.top =
            (touch.clientY - offsetY) + "px";
    }

    function end(){

        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", end);

        document.removeEventListener("touchmove", move);
        document.removeEventListener("touchend", end);

        snapPiece(piece);
    }

    piece.addEventListener("mousedown", start);
    piece.addEventListener("touchstart", start);
}

/* Snap */

function snapPiece(piece){

    document.querySelectorAll(".slot").forEach(slot=>{

        const pRect = piece.getBoundingClientRect();
        const sRect = slot.getBoundingClientRect();

        const dx = Math.abs(pRect.left - sRect.left);
        const dy = Math.abs(pRect.top - sRect.top);

        if(
            dx < 40 &&
            dy < 40 &&
            correct[piece.id] === slot.id
        ){

            piece.style.left =
                (board.offsetLeft + slot.offsetLeft) + "px";

            piece.style.top =
                (board.offsetTop + slot.offsetTop) + "px";

            piece.dataset.locked = "yes";

            piece.style.pointerEvents = "none";

            if(!piece.dataset.scored){

                piece.dataset.scored = "yes";

                solved++;

               if(solved === 9){

    const msg =
        document.getElementById("message");

    const games =
        document.getElementById("gamesSection");

    msg.classList.add("show");

    games.style.display = "block";

    setTimeout(() => {

    msg.classList.remove("show");

},4000);

setTimeout(() => {

    document.getElementById("gamesSection")
            .scrollIntoView({
                behavior:"smooth"
            });

},4200);
}
            }
        }

    });

}

/* Buttons */

document.getElementById("shuffleBtn")
.addEventListener("click",()=>{

    pieces.forEach(p=>{
        p.dataset.scored="";
    });

    shufflePieces();
});

document.getElementById("resetBtn")
.addEventListener("click",()=>{

    pieces.forEach(p=>{
        p.dataset.scored="";
    });

    resetPieces();
});

/* Initial Layout */

resetPieces();

</script>

</body>
</html>
