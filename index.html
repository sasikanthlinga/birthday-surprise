<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:
linear-gradient(
rgba(255, 20, 147, 0.35),
rgba(255, 182, 193, 0.35)
),
url('photo8.jpeg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
}

.container{
    padding:30px;
}

h1{
color:white;
font-size:3rem;
text-shadow:2px 2px 10px rgba(0,0,0,0.8);
}
.message{
color:white;
text-shadow:1px 1px 8px rgba(0,0,0,0.8);
}

.gallery{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-top:20px;
}

.gallery img{
    width:250px;
    height:300px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
}

.message{
    font-size:1.3rem;
    color:#444;
    max-width:800px;
    margin:auto;
    padding:20px;
}

.btn{
    background:#ff0066;
    color:white;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
}

.btn:hover{
    background:#d60057;
}
    .confetti-piece {
    position: fixed;
    width: 8px;
    height: 8px;
    pointer-events: none;
    z-index: 9999;
    border-radius: 2px;
}

@keyframes explode {
    from {
        transform: translate(0,0) rotate(0deg);
        opacity: 1;
    }

    to {
        transform:
            translate(var(--x), var(--y))
            rotate(720deg);
        opacity: 0;
    }
}
.heart-burst{
    position:fixed;
    font-size:28px;
    pointer-events:none;
    z-index:9999;

    animation: heartFly 1.5s ease-out forwards;
}

@keyframes heartFly{
    from{
        transform:translate(0,0) scale(1);
        opacity:1;
    }
    to{
        transform:
            translate(var(--x), var(--y))
            scale(1.8);

        opacity:0;
    }
}
</style>
</head>

<body>

<!-- Background Music >
<audio autoplay loop controls>
    birthday-song.mp3
</audio-->
<script>

document.querySelectorAll(".birthday-photo")
.forEach(photo => {

    photo.addEventListener("click", function(e){

        for(let i=0; i<25; i++){

            const heart =
                document.createElement("div");

            heart.className = "heart-burst";
            heart.innerHTML = "💖";

            heart.style.left =
                e.clientX + "px";

            heart.style.top =
                e.clientY + "px";

            const x =
                (Math.random()-0.5)*300;

            const y =
                (Math.random()-0.5)*300;

            heart.style.setProperty(
                "--x", x+"px"
            );

            heart.style.setProperty(
                "--y", y+"px"
            );

            document.body.appendChild(
                heart
            );

            setTimeout(() => {
                heart.remove();
            },1500);
        }
    });
});

</script>

<div class="container">

    <h1>🎉 Happy Birthday Nainee 🎂</h1>

    <p class="message">
        Wishing you a wonderful birthday filled with happiness,
        laughter, love, and unforgettable memories.
        May all your dreams come true and your year be full of success! 🌟
    </p>

    <!--div class="gallery">
        <img src="photo1.jpeg" alt="Photo 1">
        <img src="photo5.jpeg" alt="Photo 2">
        <img src="photo3.jpeg" alt="Photo 3">
        <img src="photo4.jpeg" alt="Photo 4">
</div-->
    <div class="gallery">
    <img class="birthday-photo" src="photo1.jpeg" alt="Photo 1">
    <img class="birthday-photo" src="photo5.jpeg" alt="Photo 2">
    <img class="birthday-photo" src="photo3.jpeg" alt="Photo 3">
    <img class="birthday-photo" src="photo4.jpeg" alt="Photo 4">
</div>

    <br>

    <button class="btn" onclick="window.location.href='treats.html'">
        Click for a Special Wish 🎁
    </button>

</div>

</body>
</html>
