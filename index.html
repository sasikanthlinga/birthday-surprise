<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
    overflow-x:hidden;
}

.container{
    padding:30px;
}

h1{
    color:#ff0066;
    font-size:3rem;
}

.gallery{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-top:20px;
}

.gallery img{
    width:250px;
    height:300px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
}

.message{
    font-size:1.3rem;
    color:#444;
    max-width:800px;
    margin:auto;
    padding:20px;
}

.btn{
    background:#ff0066;
    color:white;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
}

.btn:hover{
    background:#d60057;
}
</style>
</head>

<body>

<!-- Background Music -->
<audio autoplay loop controls>
    birthday-song.mp3
</audio>

<div class="container">

    <h1>🎉 Happy Birthday Anusha 🎂</h1>

    <p class="message">
        Wishing you a wonderful birthday filled with happiness,
        laughter, love, and unforgettable memories.
        May all your dreams come true and your year be full of success! 🌟
    </p>

    <div class="gallery">
        <img src="photo1.jpg" alt="Photo 1">
    </div>

    <br>

    <button class="btn" onclick="window.location.href='treats.html'">
        Click for a Special Wish 🎁
    </button>

</div>

</body>
</html>
