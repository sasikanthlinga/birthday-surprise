<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nainee 🎂</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    text-align:center;
    min-height:100vh;
    padding:20px;

    background:
    linear-gradient(
        rgba(255,20,147,0.25),
        rgba(255,182,193,0.25)
    ),
    url('photo8.jpeg');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

/* Birthday Card */

.container{
    width:90%;
    max-width:1000px;

    margin:30px auto;
    padding:30px;

    background:rgba(255,255,255,0.08);

    border-radius:30px;

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
    0 8px 25px rgba(0,0,0,0.25);
}

h1{
    color:white;
    font-size:3rem;

    text-shadow:
    2px 2px 10px rgba(0,0,0,0.7);
}

.message-box{
    background:rgba(0,0,0,0.25);
    padding:20px;
    border-radius:20px;
    margin-top:20px;
}
.special-line{
    font-family:"Brush Script MT", cursive;
    font-size:1.8rem;
    color:#ffeb99;
    text-shadow:0 0 15px rgba(255,255,255,0.8);
}

.message{
    color:white;
    font-size:1.2rem;
    line-height:1.8;
}

.memories-title{
    color:white;
    font-size:24px;
    margin-top:25px;
    text-shadow:0 0 10px white;
}

/* Gallery */

.gallery{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
    margin-top:25px;
}

.birthday-photo{
    width:240px;
    height:300px;

    object-fit:cover;

    border-radius:20px;

    cursor:pointer;

    border:3px solid rgba(255,255,255,0.4);

    box-shadow:
    0 8px 20px rgba(0,0,0,0.35);

    transition:.4s ease;

    animation:
    floatPhoto 4s ease-in-out infinite;
}

.gallery img:nth-child(1){
    transform:rotate(-5deg);
    animation-delay:0s;
}

.gallery img:nth-child(2){
    transform:rotate(5deg);
    animation-delay:1s;
}

.gallery img:nth-child(3){
    transform:rotate(-4deg);
    animation-delay:2s;
}

.gallery img:nth-child(4){
    transform:rotate(4deg);
    animation-delay:3s;
}

.birthday-photo:hover{
    scale:1.08;
}

@keyframes floatPhoto{

    0%,100%{
        translate:0 0;
    }

    50%{
        translate:0 -12px;
    }
}

/* Burst Animation */

.burst{
    position:fixed;

    pointer-events:none;

    z-index:9999;

    font-size:28px;

    animation:
    burstAnimation 1.2s ease-out forwards;
}

@keyframes burstAnimation{

    from{
        opacity:1;
        transform:
        translate(0,0)
        scale(1);
    }

    to{
        opacity:0;

        transform:
        translate(var(--x),var(--y))
        scale(2);
    }
}

/* Button */

.btn{
    margin-top:30px;

    background:#ff0066;
    color:white;

    border:none;

    padding:15px 30px;

    border-radius:30px;

    cursor:pointer;

    font-size:18px;

    transition:.3s;
}

.btn:hover{
    background:#d60057;
    transform:scale(1.05);
}

.reveal{

    opacity:0;

    transition:1s ease;
}

.reveal.show{

    opacity:1;
}

#birthdayTitle::after,
#birthdayMessage::after{

    content:"|";

    animation:blinkCursor .8s infinite;
}

@keyframes blinkCursor{

    50%{
        opacity:0;
    }
}

/* Mobile */

@media(max-width:768px){

    .container{
        width:100%;
        padding:20px;
    }

    h1{
        font-size:2rem;
    }

    .message{
        font-size:1rem;
    }

    .birthday-photo{
        width:160px;
        height:210px;
    }

    .btn{
        width:100%;
        max-width:300px;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1 id="birthdayTitle"></h1>

    <div class="message-box">

        <p class="message" id="birthdayMessage"></p>

    </div>

<div class="life-timer reveal">
    <h2 style="color:white; margin-top:30px;">
        ⏳ Time spent, Since you stepped on this Earth
    </h2>

    <div id="earthTimer"
         style="
         color:white;
         font-size:1.3rem;
         margin-top:15px;
         background:rgba(0,0,0,0.25);
         padding:20px;
         border-radius:20px;">
    </div>
</div>


    <div class="memories-title reveal">
<span class='special-line'> So far, you've completed this amazing journey on Earth. 🌍 And trust me, there are still so many wonderful days, adventures, and achievements waiting for you. 💫.</span>
 <br><br>
        ✨ A Few Beautiful Memories ✨
    </div>

    <p class="reveal" style="color:white; margin-top:10px;">
        💖 Tap Any Photo For A Surprise 💖
    </p>

    <div class="gallery reveal">

        <img class="birthday-photo"
             src="photo16.jpeg"
             alt="Photo 1">

        <img class="birthday-photo"
             src="photo5.jpeg"
             alt="Photo 2">

        <img class="birthday-photo"
             src="photo3.jpeg"
             alt="Photo 3">

        <img class="birthday-photo"
             src="photo4.jpeg"
             alt="Photo 4">

    </div>

    <button
        <button class="btn reveal"
        onclick="window.location.href='treats.html'">

        Click for a Special Wish 🎁

    </button>

</div>

<script>
const titleText =
"🎉 Happy Birthday Nainee 🎂";

const messageText =
"<span class='special-line'> ✨I hope you are doing well!! This little surprise 🎁 is just to bring a smile to your face.</span><br><br>Wishing you a wonderful birthday filled with happiness, laughter, love, and unforgettable memories. 💖";

const title =
document.getElementById(
"birthdayTitle"
);

const message =
document.getElementById(
"birthdayMessage"
);

function updateEarthTimer() {

    // YYYY-MM-DDTHH:MM:SS
    const birthDate = new Date("2006-10-03T08:30:00");

    const now = new Date();

    let diff = now.getTime() - birthDate.getTime();

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    diff %= (1000 * 60 * 60 * 24);

    const hours = Math.floor(diff / (1000 * 60 * 60));
    diff %= (1000 * 60 * 60);

    const minutes = Math.floor(diff / (1000 * 60));
    diff %= (1000 * 60);

    const seconds = Math.floor(diff / 1000);

    document.getElementById("earthTimer").innerHTML =
        `🌍 ${days.toLocaleString()} Days<br>
         ⏰ ${hours} Hours ${minutes} Minutes ${seconds} Seconds`;
}

updateEarthTimer();
setInterval(updateEarthTimer, 1000);

let titleIndex = 0;

function typeTitle(){

    if(titleIndex < titleText.length){

        title.innerHTML +=
        titleText.charAt(titleIndex);

        titleIndex++;

        setTimeout(
            typeTitle,
            80
        );

    }else{

        setTimeout(
            typeMessage,
            400
        );
    }
}

let messageIndex = 0;

function typeMessage() {
    if (messageIndex < messageText.length) {

        message.innerHTML =
            messageText.substring(0, messageIndex + 1);

        messageIndex++;

        setTimeout(
            typeMessage,
            25
        );

    } else {

        revealContent();

    }
}

function revealContent(){

    document
    .querySelectorAll(".reveal")
    .forEach((item,index)=>{

        setTimeout(()=>{

            item.classList.add(
                "show"
            );

        }, index * 400);

    });
}
const items = [
    "💖",
    "❤️",
    "🌹",
    "🎂",
    "🎁",
    "✨",
    "🎉"
];

document
.querySelectorAll('.birthday-photo')
.forEach(photo => {

    photo.addEventListener('click', burst);
    photo.addEventListener('touchstart', burst);

});

function burst(e){

    let x,y;

    if(e.touches){

        x = e.touches[0].clientX;
        y = e.touches[0].clientY;

    }else{

        x = e.clientX;
        y = e.clientY;
    }

    for(let i=0;i<30;i++){

        let item =
        document.createElement('div');

        item.className='burst';

        item.innerHTML =
        items[Math.floor(
            Math.random()*items.length
        )];

        item.style.left=x+'px';
        item.style.top=y+'px';

        const angle =
        Math.random()*Math.PI*2;

        const distance =
        80 + Math.random()*250;

        const moveX =
        Math.cos(angle)*distance;

        const moveY =
        Math.sin(angle)*distance;

        item.style.setProperty(
            '--x',
            moveX+'px'
        );

        item.style.setProperty(
            '--y',
            moveY+'px'
        );

        document.body.appendChild(item);

        setTimeout(()=>{
            item.remove();
        },1200);
    }
}
typeTitle();

</script>

</body>
</html
